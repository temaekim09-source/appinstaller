<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Каталог приложений</title>
    <style>
        /* Сброс стилей и базовые настройки */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117; /* Тёмный фон */
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        /* Шапка сайта */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 0%, #8b949e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 14px;
            color: #8b949e;
        }

        /* Плашка предупреждения */
        .warning-box {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 16px;
            padding: 14px 16px;
            font-size: 13px;
            line-height: 1.5;
            color: #d1d5db;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        /* Карточка приложения */
        .app-card {
            background: #161b22;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .app-card:active {
            transform: scale(0.98);
        }

        /* Блок с иконкой и названием */
        .app-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Иконка приложения */
        .app-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #21262d;
        }

        .app-details {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .app-subtitle {
            font-size: 12px;
            color: #8b949e;
        }

        /* Кнопка "Скачать" */
        .download-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 20px;
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.3);
            transition: background 0.2s;
        }

        .download-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<script>
    /* Пароль на вход */
    (function() {
        const SECRET_PASSWORD = "1234"; 
        if (sessionStorage.getItem("site_access") !== "true") {
            let pass = prompt("Введите пароль для доступа:");
            if (pass === SECRET_PASSWORD) {
                sessionStorage.setItem("site_access", "true");
            } else {
                alert("Неверный пароль!");
                document.body.innerHTML = "<div style='color:white;text-align:center;margin-top:100px;'><h2>⛔ Доступ запрещен</h2></div>";
            }
        }
    })();
</script>

<div class="container">

    </div>

    <div class="warning-box">
        ⚠️ <span style="color: #f59e0b; font-weight: bold;">ВАЖНО:</span> Перед скачиванием войдите в выданный Apple ID в разделе <span style="color: #3b82f6;">«Контент и покупки»</span>.
    </div>

    <div class="app-card">
        <div class="app-info">
            <img src="https://vk.com/favicons/fav_logo.ico" class="app-icon" alt="VK">
            <div class="app-details">
                <span class="app-title">ВКонтакте</span>
                <span class="app-subtitle">Социальная сеть</span>
            </div>
        </div>
        <a class="download-btn" href="itms-services://?action=download-manifest&url=https://temaekim09-source.github.io/appinstaller/vk.plist">Скачать</a>
    </div>

    <div class="app-card">
        <div class="app-info">
            <img src="https://www.sberbank.ru/favicon.ico" class="app-icon" alt="Сбер">
            <div class="app-details">
                <span class="app-title">СберБанк</span>
                <span class="app-subtitle">Финансы</span>
            </div>
        </div>
        <a class="download-btn" href="itms-services://?action=download-manifest&url=https://temaekim09-source.github.io/appinstaller/sber.plist">Скачать</a>
    </div>

    <div class="app-card">
        <div class="app-info">
            <img src="https://acdn.tinkoff.ru/static/pages/files/a3a60a71-6c38-4e89-be2a-ea91bf14e5a9.png" class="app-icon" alt="Т-Банк">
            <div class="app-details">
                <span class="app-title">Т-Банк</span>
                <span class="app-subtitle">Банкинг</span>
            </div>
        </div>
        <a class="download-btn" href="itms-services://?action=download-manifest&url=https://temaekim09-source.github.io/appinstaller/tbank.plist">Скачать</a>
    </div>

</div>

</body>
</html>
