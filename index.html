<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Каталог приложений</title>
    <style>
        body { background-color: #0b0e14; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; }
        h1 { font-size: 22px; margin-bottom: 8px; text-align: center; }
        .subtitle { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 20px; }
        .warning-box { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); color: #fef3c7; border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.4; margin-bottom: 20px; }
        .card { background: #161b26; border-radius: 16px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; gap: 14px; }
        label { font-size: 14px; font-weight: 600; color: #e2e8f0; }
        select { background: #0b0e14; color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.2); padding: 12px; border-radius: 10px; font-size: 15px; width: 100%; outline: none; }
        select:focus { border-color: #6366f1; }
        .btn { background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; text-decoration: none; font-weight: 600; font-size: 15px; padding: 12px; border-radius: 10px; text-align: center; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); display: block; }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<script>
    (function() {
        const SECRET_PASSWORD = "deputat705"; 
        if (sessionStorage.getItem("site_access") !== "true") {
            let pass = prompt("Введите пароль для доступа к каталогу:");
            if (pass === SECRET_PASSWORD) {
                sessionStorage.setItem("site_access", "true");
            } else {
                alert("Неверный пароль!");
                document.body.innerHTML = "<div style='color:white;text-align:center;margin-top:100px;font-family:sans-serif;'><h2>⛔ Доступ запрещен</h2><p>Неверный пароль</p></div>";
            }
        }
    })();

    function downloadApp() {
        const select = document.getElementById('appSelect');
        const url = select.value;
        if (url) {
            window.location.href = url;
        } else {
            alert('Пожалуйста, выберите приложение из списка!');
        }
    }
</script>

<div class="container">
    <h1>Установка приложений</h1>
    <div class="subtitle">Установка в 1 клик через Safari</div>

    <div class="warning-box">
        ⚠️ <b>ВАЖНО:</b>Если ранее на вашем аккануте было устанновлено нужное приложение - продолжите скачивание. Если ранее приложения не было - обратитесь к продавцу! .
    </div>

    <div class="card">
        <label for="appSelect">Выберите приложение:</label>
        <select id="appSelect">
            <option value="" disabled selected>-- Нажмите для выбора --</option>
            <option value="itms-services://?action=download-manifest&url=https://temaekim09-source.github.io/appinstaller/vk.plist">ВКонтакте</option>
            <option value="itms-services://?action=download-manifest&url=https://temaekim09-source.github.io/appinstaller/vk-video.plist">VK Видео</option>
            <option value="itms-services://?action=download-manifest&url=https://temaekim09-source.github.io/appinstaller/sber.plist">СберБанк</option>
            <option value="itms-services://?action=download-manifest&url=https://temaekim09-source.github.io/appinstaller/tbank.plist">Т-Банк</option>
            <option value="itms-services://?action=download-manifest&url=https://temaekim09-source.github.io/appinstaller/yandex-pay.plist">Яндекс Пэй</option>
            <option value="itms-services://?action=download-manifest&url=https://temaekim09-source.github.io/appinstaller/avito.plist">Авито</option>
            <option value="itms-services://?action=download-manifest&url=https://temaekim09-source.github.io/appinstaller/lenta.plist">Лента</option>
            <option value="itms-services://?action=download-manifest&url=https://temaekim09-source.github.io/appinstaller/max.plist">Макс (Max)</option>
        </select>

        <a class="btn" href="javascript:void(0);" onclick="downloadApp()">Скачать выбранное</a>
    </div>
</div>

</body>
</html>
