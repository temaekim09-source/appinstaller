<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS App Installer</title>
    <style>
        /* Общие чистые стили без фонов */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7; /* Стандартный светло-серый фон iOS */
            color: #1d1d1f;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            font-size: 16px;
            color: #86868b;
            margin-bottom: 25px;
        }

        /* Стили для выпадающего списка */
        select {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            background-color: #ffffff;
            margin-bottom: 20px;
            -webkit-appearance: none; /* Убираем стандартный стиль iOS */
            appearance: none;
        }

        /* Стили для кнопки */
        button {
            background-color: #0071e3; /* Эппловский синий */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #0077ed;
        }

        button:active {
            background-color: #0056ad;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Установка приложений</h1>
        <p>Выберите приложение из списка ниже и нажмите кнопку «Установить».</p>

        <!-- Ваш список приложений с вашими актуальными ссылками -->
        <select id="appSelect">
            <option value="" disabled selected>Нажмите для выбора приложения</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://app-installer-ios.github.io/store/vk.plist">ВКонтакте</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://app-installer-ios.github.io/store/max.plist">Макс (Max)</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://app-installer-ios.github.io/store/vk-video.plist">VK Видео</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://app-installer-ios.github.io/store/sber.plist">СберБанк</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://app-installer-ios.github.io/store/avito.plist">Авито</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://app-installer-ios.github.io/store/tbank.plist">Т-Банк</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://app-installer-ios.github.io/store/lenta.plist">Лента</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://app-installer-ios.github.io/store/yandex-pay.plist">Яндекс Пэй</option>
        </select>

        <button onclick="installApp()">Установить</button>
    </div>

    <script>
        function installApp() {
            var select = document.getElementById('appSelect');
            var url = select.value;
            
            if (url) {
                window.location.href = url;
            } else {
                alert('Пожалуйста, выберите приложение из списка.');
            }
        }
    </script>

</body>
</html>
