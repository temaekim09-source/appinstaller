<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Установка удалённых приложений</title>
    <style>
        body { 
            background-color: #0b0e14; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 20px 16px; 
            display: flex; 
            justify-content: center; 
        }
        .container { width: 100%; max-width: 400px; position: relative; }
        
        h1 { 
            font-size: 22px; 
            margin-bottom: 8px; 
            text-align: center; 
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .subtitle { font-size: 13px; color: #cbd5e1; text-align: center; margin-bottom: 20px; font-weight: 500; }
        
        .warning-box { 
            background: rgba(245, 158, 11, 0.12); 
            border: 1px solid rgba(245, 158, 11, 0.5); 
            color: #fef3c7; 
            border-radius: 14px; 
            padding: 12px 14px; 
            font-size: 13px; 
            line-height: 1.5; 
            margin-bottom: 20px; 
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.1);
        }
        
        .text-warning { color: #fbbf24; font-weight: bold; }
        .text-danger { color: #f87171; font-weight: bold; }
        .text-highlight { color: #38bdf8; font-weight: 600; }

        .card { 
            background: #161b26; 
            border-radius: 16px; 
            padding: 20px; 
            border: 1px solid rgba(99, 102, 241, 0.3); 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        
        label { font-size: 14px; font-weight: 600; color: #f1f5f9; }
        
        select { 
            background: #0b0e14; 
            color: #38bdf8; 
            border: 2px solid #6366f1; 
            padding: 12px; 
            border-radius: 10px; 
            font-size: 15px; 
            width: 100%; 
            outline: none; 
            font-weight: 600;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
            -webkit-appearance: none;
        }
        select:focus { border-color: #a855f7; box-shadow: 0 0 14px rgba(168, 85, 247, 0.4); }
        
        .btn { 
            background: linear-gradient(135deg, #a855f7, #6366f1); 
            color: #ffffff; 
            border: none;
            font-weight: 700; 
            font-size: 16px; 
            padding: 14px; 
            border-radius: 10px; 
            text-align: center; 
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4); 
            display: block; 
            width: 100%;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.97); opacity: 0.9; }

        /* Зелёное всплывающее уведомление */
        .toast {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(16, 185, 129, 0.95);
            border: 1px solid #34d399;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            z-index: 1000;
            text-align: center;
            width: 80%;
            max-width: 320px;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>

<div id="toast" class="toast">🚀 Загрузка началась! Проверьте экран «Домой»</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const SECRET_PASSWORD = "deputat70356"; 
        const appContainer = document.getElementById("mainApp");

        if (sessionStorage.getItem("site_access") === "true") {
            appContainer.style.display = "block";
        } else {
            let pass = prompt("Введите пароль для доступа к каталогу:");
            if (pass === SECRET_PASSWORD) {
                sessionStorage.setItem("site_access", "true");
                appContainer.style.display = "block";
            } else {
                alert("Неверный пароль!");
                document.body.innerHTML = "<div style='color:white;text-align:center;margin-top:100px;font-family:sans-serif;'><h2>⛔ Доступ запрещен</h2><p>Неверный пароль</p></div>";
            }
        }
    });

    function startInstallation() {
        const select = document.getElementById('appSelect');
        const url = select.value;
        if (url) {
            // Показываем зеленое уведомление
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);

            // Переходим по ссылке установки
            window.location.assign(url);
        } else {
            alert('Пожалуйста, выберите приложение из списка!');
        }
    }
</script>

<div class="container" id="mainApp" style="display: none;">
    <h1>Установка удалённых приложений</h1>
    <div class="subtitle">Установка нужных приложений без лишних хлопот</div>

    <div class="warning-box">
        ⚠️ <span class="text-warning">ВАЖНО:</span> Если ранее на вашем аккаунте было установлено нужное приложение — <span class="text-highlight">продолжите скачивание</span>. Если ранее приложения не было — <span class="text-danger">обратитесь к продавцу!</span>
    </div>

    <div class="card">
        <label for="appSelect">Выберите приложение:</label>
        <select id="appSelect">
            <option value="" disabled selected>Нажмите для выбора приложения</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://temaekim09-source.github.io/appinstaller/vk.plist">ВКонтакте</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://temaekim09-source.github.io/appinstaller/max.plist">Макс (Max)</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://temaekim09-source.github.io/appinstaller/vk-video.plist">VK Видео</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://temaekim09-source.github.io/appinstaller/sber.plist">СберБанк</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://temaekim09-source.github.io/appinstaller/avito.plist">Авито</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://temaekim09-source.github.io/appinstaller/tbank.plist">Т-Банк</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://temaekim09-source.github.io/appinstaller/lenta.plist">Лента</option>
            <option value="itms-services://?action=download-manifest&amp;url=https://temaekim09-source.github.io/appinstaller/yandex-pay.plist">Яндекс Пэй</option>
        </select>

        <button type="button" class="btn" onclick="startInstallation()">Установить</button>
    </div>
</div>

</body>
</html>
